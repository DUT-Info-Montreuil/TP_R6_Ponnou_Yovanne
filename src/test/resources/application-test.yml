spring:
  datasource:
    url: jdbc:tc:postgresql:15:///masterannonce
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: test-secret-key-for-jwt-should-be-at-least-thirty-two-bytes-long
  expiration: 86400000
  refresh-expiration: 604800000

rate-limit:
  login:
    capacity: 100
    refill-seconds: 1
