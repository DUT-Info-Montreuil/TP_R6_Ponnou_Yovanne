spring:
  application:
    name: masterannonce

  datasource:
    url: jdbc:postgresql://localhost:5433/masterannonce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# JWT Configuration
jwt:
  secret: MasterAnnonceSecretKeyForJWTTokenGeneration2025PonnouYovanne
  expiration: 86400000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
