spring:
  application:
    name: masterannonce

  datasource:
    url: jdbc:postgresql://localhost:5433/masterannonce
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:MasterAnnonceSecretKeyForJWTTokenGeneration2025PonnouYovanne}
  expiration: 86400000
  refresh-expiration: 604800000

# Rate limiting (login)
rate-limit:
  login:
    capacity: 5
    refill-seconds: 60

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: MasterAnnonce
    description: API REST de gestion d'annonces
    version: 1.0

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
